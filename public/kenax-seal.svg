<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Vibrant Blue-to-Cyan electric gradient for X in center logo -->
    <linearGradient id="sealXGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#00A8FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Glowing Cyan swoosh for X -->
    <linearGradient id="sealSwooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Fountain Pen Signature Ink Gradient -->
    <linearGradient id="signatureInkGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#003580" />
      <stop offset="40%" stop-color="#0056b3" />
      <stop offset="80%" stop-color="#023e8a" />
      <stop offset="100%" stop-color="#00296b" />
    </linearGradient>

    <!-- Authentic Seal Ink Style Definitions -->
    <style>
      .seal-ink { fill: #032b69; }
      .seal-stroke { stroke: #032b69; fill: none; }
      .seal-top-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 900; font-size: 25px; letter-spacing: 8.5px; fill: #032b69; }
      .seal-bottom-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 5.5px; fill: #032b69; }
      .seal-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 800; font-size: 11px; fill: #032b69; letter-spacing: 2px; }
      .seal-authority { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 700; font-size: 10px; fill: #0284c7; letter-spacing: 1.5px; }
    </style>

    <!-- Top Arc Path for ★ KENAX BD OFFICIAL SEAL ★ -->
    <path id="sealTopArc" d="M 68,250 A 182,182 0 0,1 432,250" />

    <!-- Bottom Arc Path for ★ AUTHORIZED & VERIFIED ★ (Clockwise for clean left-to-right reading) -->
    <path id="sealBottomArc" d="M 432,250 A 182,182 0 0,1 68,250" />
  </defs>

  <!-- 1. Concentric Stamp Borders (Authentic Official Stamp Frame) -->
  <!-- Outer Thick Border -->
  <circle cx="250" cy="250" r="238" class="seal-stroke" stroke-width="7" />
  <!-- Outer Secondary Thin Border -->
  <circle cx="250" cy="250" r="226" class="seal-stroke" stroke-width="2.5" />
  <!-- Inner Ring Border -->
  <circle cx="250" cy="250" r="172" class="seal-stroke" stroke-width="2" />
  <!-- Inner Subtle Accent Ring -->
  <circle cx="250" cy="250" r="166" class="seal-stroke" stroke-width="1.2" stroke-dasharray="4,4" />

  <!-- 2. Curved Top Text: ★ KENAX BD OFFICIAL SEAL ★ -->
  <text class="seal-top-text" text-anchor="middle">
    <textPath href="#sealTopArc" startOffset="50%">
      ★ KENAX BD OFFICIAL SEAL ★
    </textPath>
  </text>

  <!-- 3. Curved Bottom Text: ★ AUTHORIZED & VERIFIED ★ -->
  <text class="seal-bottom-text" text-anchor="middle">
    <textPath href="#sealBottomArc" startOffset="50%">
      ★ AUTHORIZED &amp; VERIFIED ★
    </textPath>
  </text>

  <!-- 4. OFFICIAL KENAX BD LOGO INSIDE THE SEAL -->
  <!-- Centered in the middle of the seal so the signature can overlap on top -->
  <g id="seal-official-kenax-logo" transform="translate(250, 222) scale(0.82)">
    <!-- Speed Shopping Cart Store Sign -->
    <g transform="translate(-125, -60)">
      <!-- 3 Cyan Speed lines -->
      <line x1="86" y1="12" x2="104" y2="12" stroke="#00A8FF" stroke-width="2.8" stroke-linecap="round" />
      <line x1="78" y1="18.5" x2="101" y2="18.5" stroke="#00A8FF" stroke-width="3.2" stroke-linecap="round" />
      <line x1="84" y1="25" x2="104" y2="25" stroke="#00A8FF" stroke-width="2.8" stroke-linecap="round" />

      <!-- Deep Navy Blue Basket Frame -->
      <path
        d="M106 8 L114 8 L121 25 L150 25 L155 12 L117 12"
        stroke="#032b69"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <line x1="119" y1="18.5" x2="152" y2="18.5" stroke="#032b69" stroke-width="2.2" stroke-linecap="round" />

      <!-- Wheels -->
      <circle cx="126" cy="31" r="3.6" fill="#00A8FF" stroke="#032b69" stroke-width="1.6" />
      <circle cx="145" cy="31" r="3.6" fill="#00A8FF" stroke="#032b69" stroke-width="1.6" />
    </g>

    <!-- Wordmark: KenaX (Center) -->
    <g transform="translate(-101, 10)">
      <!-- "Kena" text in bold navy -->
      <text
        x="0"
        y="0"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
        font-size="44"
        font-weight="900"
        letter-spacing="-1.5"
        fill="#032b69"
      >
        Kena
      </text>

      <!-- Stylized "X" with dynamic electric blue/cyan gradient and aerodynamic swoosh -->
      <g transform="translate(114, -36)">
        <path
          d="M6 3 L19 3 L32 24 L45 3 L58 3 L39 29 L60 48 L47 48 L32 34 L17 48 L4 48 L25 27 Z"
          fill="url(#sealXGrad)"
        />
        <path
          d="M-5 28 C12 28, 22 23, 40 12 C48 7, 56 3, 63 1 C55 7, 36 21, 24 27 C16 31, 6 32, -5 30 Z"
          fill="url(#sealSwooshGrad)"
        />
        <path
          d="M0 27.5 C16 27.5, 30 20, 52 7 C40 15, 22 26, 0 27.5 Z"
          fill="#FFFFFF"
          opacity="0.9"
        />
      </g>
    </g>

    <!-- Bottom Accent: — BD — -->
    <g transform="translate(-125, 32)">
      <line x1="72" y1="0" x2="105" y2="0" stroke="#00A8FF" stroke-width="2.8" stroke-linecap="round" />
      <text
        x="125"
        y="3.5"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
        font-size="16"
        font-weight="900"
        letter-spacing="2.5"
        fill="#032b69"
      >
        BD
      </text>
      <line x1="145" y1="0" x2="178" y2="0" stroke="#00A8FF" stroke-width="2.8" stroke-linecap="round" />
    </g>
  </g>

  <!-- 5. STYLISH & UNIQUE SADIK SIGNATURE OVERLAPPING DIRECTLY ON TOP OF KENAX BD LOGO -->
  <!-- Layered directly across the center logo with authentic fountain-pen pressure, flourish, and halo for sharp contrast -->
  <g id="sadik-overlapping-signature" transform="translate(250, 226) rotate(-7)">
    <!-- Subtle crisp halo behind signature strokes to make overlapping authentic and sharply legible over the navy/cyan logo -->
    <g opacity="0.9" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -118, 14 C -128, 8, -136, -6, -126, -28 C -118, -46, -94, -50, -90, -30 C -86, -12, -112, 10, -94, 20 C -80, 26, -66, 12, -70, -6" fill="none" stroke-width="6.5" />
      <path d="M -70, -6 C -64, -16, -48, -16, -48, -4 C -48, 8, -66, 10, -56, 16 C -50, 18, -42, 12, -40, 4" fill="none" stroke-width="5.8" />
      <path d="M -40, 4 C -36, -10, -24, -12, -22, -2 C -20, 8, -36, 14, -22, 16 C -18, 16, -16, 6, -14, -36 C -13, -46, -8, -44, -10, -32 L -10, 14 C -10, 18, -2, 16, 0, 8" fill="none" stroke-width="5.8" />
      <path d="M 0, 8 C 6, -4, 12, -8, 14, -2 L 14, 14 C 14, 18, 20, 18, 24, 10" fill="none" stroke-width="5.5" />
      <ellipse cx="16" cy="-18" rx="4.2" ry="4.8" fill="#ffffff" />
      <path d="M 24, 10 C 28, -6, 34, -30, 38, -40 C 41, -48, 46, -46, 44, -32 L 40, 14 M 40, 0 C 47, -8, 56, -4, 50, 6 C 47, 10, 58, 16, 76, 18" fill="none" stroke-width="5.8" />
      <path d="M 76, 18 C 98, 20, 114, 10, 108, -6 C 100, -24, 72, -4, 30, 24 C -18, 40, -74, 38, -124, 28 C -136, 26, -144, 20, -138, 16 C -132, 12, -102, 18, -60, 26 C 12, 34, 84, 28, 130, 24" fill="none" stroke-width="5.5" />
    </g>

    <!-- Main Rich Calligraphic Fountain Pen Ink Signature "Sadik" -->
    <!-- Capital 'S': Flowing loop and expressive ascender -->
    <path
      d="M -118, 14
         C -128, 8, -136, -6, -126, -28
         C -118, -46, -94, -50, -90, -30
         C -86, -12, -112, 10, -94, 20
         C -80, 26, -66, 12, -70, -6"
      fill="none"
      stroke="url(#signatureInkGrad)"
      stroke-width="4.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Lowercase 'a': Seamless connection from 'S' -->
    <path
      d="M -70, -6
         C -64, -16, -48, -16, -48, -4
         C -48, 8, -66, 10, -56, 16
         C -50, 18, -42, 12, -40, 4"
      fill="none"
      stroke="url(#signatureInkGrad)"
      stroke-width="3.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Lowercase 'd': Graceful round belly and tall ascender loop -->
    <path
      d="M -40, 4
         C -36, -10, -24, -12, -22, -2
         C -20, 8, -36, 14, -22, 16
         C -18, 16, -16, 6, -14, -36
         C -13, -46, -8, -44, -10, -32
         L -10, 14
         C -10, 18, -2, 16, 0, 8"
      fill="none"
      stroke="url(#signatureInkGrad)"
      stroke-width="3.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Lowercase 'i': Upbeat, stem, and distinct calligraphic dot -->
    <path
      d="M 0, 8
         C 6, -4, 12, -8, 14, -2
         L 14, 14
         C 14, 18, 20, 18, 24, 10"
      fill="none"
      stroke="url(#signatureInkGrad)"
      stroke-width="3.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Dot of 'i' -->
    <ellipse cx="16" cy="-18" rx="2.8" ry="3.6" transform="rotate(-15 16 -18)" fill="#003580" />

    <!-- Lowercase 'k': Tall ascender, signature knot, and dynamic flourish launch -->
    <path
      d="M 24, 10
         C 28, -6, 34, -30, 38, -40
         C 41, -48, 46, -46, 44, -32
         L 40, 14
         M 40, 0
         C 47, -8, 56, -4, 50, 6
         C 47, 10, 58, 16, 76, 18"
      fill="none"
      stroke="url(#signatureInkGrad)"
      stroke-width="3.9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Signature Flourish: Signature swoosh sweeping across the logo -->
    <path
      d="M 76, 18
         C 98, 20, 114, 10, 108, -6
         C 100, -24, 72, -4, 30, 24
         C -18, 40, -74, 38, -124, 28
         C -136, 26, -144, 20, -138, 16
         C -132, 12, -102, 18, -60, 26
         C 12, 34, 84, 28, 130, 24"
      fill="none"
      stroke="#003580"
      stroke-width="3.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Calligraphic terminal pen dot -->
    <circle cx="138" cy="23.5" r="3.2" fill="#003580" />
  </g>

  <!-- 6. Official Credential & Verification Badge inside seal -->
  <g transform="translate(250, 322)">
    <line x1="-90" y1="-5" x2="90" y2="-5" stroke="#032b69" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6" />
    <text text-anchor="middle" class="seal-sub">
      OFFICIALLY SIGNED &amp; SEALED • SADIK
    </text>
    <text y="14" text-anchor="middle" class="seal-authority">
      KENAX BD EXECUTIVE AUTHORITY
    </text>
    <text y="28" text-anchor="middle" font-size="9" fill="#032b69" letter-spacing="4">
      ★ ★ ★ ★ ★
    </text>
  </g>
</svg>
