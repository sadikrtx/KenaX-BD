    <script>
      (function() {
        try {
          var saved = localStorage.getItem('kenax_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.backgroundColor = '#0b0f19';
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        function isBenignFirestoreMsg(args) {
          if (!args || !args.length) return false;
          try {
            var full = Array.prototype.slice.call(args).map(function(item) {
              if (item === null || item === undefined) return '';
              if (typeof item === 'string') return item;
              if (item instanceof Error) return item.message + ' ' + (item.stack || '');
              try { return JSON.stringify(item); } catch (e) { return String(item); }
            }).join(' ');
            return (
              full.indexOf('Disconnecting idle stream') !== -1 ||
              full.indexOf('Timed out waiting for new targets') !== -1 ||
              full.indexOf("RPC 'Listen' stream") !== -1 ||
              full.indexOf('GrpcConnection RPC') !== -1 ||
              full.indexOf('@firebase/firestore') !== -1 && full.indexOf('CANCELLED') !== -1
            );
          } catch (err) {
            return false;
          }
        }

        var origErr = console.error;
        console.error = function() {
          if (isBenignFirestoreMsg(arguments)) return;
          origErr.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          if (isBenignFirestoreMsg(arguments)) return;
          origWarn.apply(console, arguments);
        };

        var origLog = console.log;
        console.log = function() {
          if (isBenignFirestoreMsg(arguments)) return;
          origLog.apply(console, arguments);
        };

        var origInfo = console.info;
        console.info = function() {
          if (isBenignFirestoreMsg(arguments)) return;
          origInfo.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && isBenignFirestoreMsg([event.reason])) {
            event.preventDefault();
          }
        });
      })();
    </script>
