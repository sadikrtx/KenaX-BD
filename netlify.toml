[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

# Netlify Serverless Function for Live Gmail SMTP Email Sending
[[redirects]]
  from = "/api/email/*"
  to = "/.netlify/functions/email"
  status = 200
  force = true

# SPA client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Aggressive immutable caching for Vite hashed assets (JS, CSS, images)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache index.html so updates are always instant
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
