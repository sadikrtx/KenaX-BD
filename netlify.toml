[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

# Netlify Serverless Function for Live Gmail SMTP Email Sending
[[redirects]]
  from = "/api/email/*"
  to = "/.netlify/functions/email"
  status = 200
  force = true

# SPA client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
