name: Deploy KenaX BD to Firebase (Hosting + Functions + Firestore Rules & Indexes)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-deploy-gen-lang-client-0077501500
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify_and_deploy:
    name: Build, Verify & Deploy to gen-lang-client-0077501500
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: gen-lang-client-0077501500
      FUNCTIONS_REGION: asia-southeast1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (Matches Cloud Functions Engine)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci || npm install

      - name: TypeScript typecheck & production build
        run: |
          npm run lint
          npm run build

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci || npm install

      - name: Validate Cloud Functions syntax
        working-directory: functions
        run: node --check index.js

      - name: Authenticate with Google Cloud Service Account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0077501500 }}

      - name: Deploy Hosting, Functions, Firestore Rules & Indexes (Safe Non-Force)
        run: |
          npx --yes firebase-tools deploy \
            --only hosting,functions,firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
